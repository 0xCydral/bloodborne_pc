# Builds dist/bbport-windows.zip on a Windows runner, the same steps as packaging/windows/README.md:
# build.sh, build_dlss.sh (MSVC + NVIDIA's public DLSS SDK) and package.sh in an MSYS2 CLANG64 shell.
# The zip is uploaded as an artifact; RELEASING.md decides whether it gets published.
name: windows-package

on:
  workflow_dispatch:
  push:
    branches: [develop]   # workflow_dispatch only sees master, which moves only when a release ships
    tags: ['windows-v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A python.org-style Python for PyInstaller (package.sh) and the tests; MSYS2's own Python builds nothing here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # C:\msys64, where msys2-env.sh and build_dlss.sh look for CLANG64.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          location: C:\
          update: true
          path-type: inherit
          install: git patch unzip curl
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -q pytest pillow
          python -m pytest -q tests

      - name: Build
        shell: msys2 {0}
        run: bash build.sh

      - name: DLSS bridge
        shell: msys2 {0}
        run: |
          git clone -q --depth 1 https://github.com/NVIDIA/DLSS "$RUNNER_TEMP/DLSS"
          DLSS_SDK_ROOT="$RUNNER_TEMP/DLSS" bash packaging/windows/build_dlss.sh

      - name: Package
        shell: msys2 {0}
        run: |
          WINPYTHON="$(cygpath -u "$pythonLocation")/python.exe" bash packaging/windows/package.sh
          sha256sum dist/bbport-windows.zip | tee dist/bbport-windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bbport-windows
          path: |
            dist/bbport-windows.zip
            dist/bbport-windows.zip.sha256
          compression-level: 0
