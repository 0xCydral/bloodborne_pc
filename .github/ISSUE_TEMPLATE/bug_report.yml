name: Bug report
description: Something does not work in the game or the launcher.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The file that helps most is the zip from **Collect logs** (launcher, **Advanced > Log**, 1.8.0-beta.8 and later): the game log of the last two runs, your settings, your PC and graphics driver, and the game crashes Windows recorded. On an older launcher, attach `user\last_run.log` from your game folder. Please attach it below.
  - type: input
    id: version
    attributes:
      label: Port version
      description: Shown at the top of the launcher, for example v1.7.1.
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and driver
      placeholder: AMD Radeon RX 6600, driver 26.8.1
    validations:
      required: true
  - type: dropdown
    id: upscaler
    attributes:
      label: Upscaler
      options:
        - DLSS
        - FSR 4
        - FSR 4.1.1 (experimental)
        - FSR 3.1
        - XeSS
        - TAA
        - Off
        - Not sure
  - type: dropdown
    id: frame-generation
    attributes:
      label: Frame generation
      options:
        - "Off"
        - "On"
        - Not sure
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Say where in the game, if it matters.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: Drag the `bloodborne-logs-....zip` from Collect logs into this box. On an older launcher, drag `user\last_run.log` or paste its contents.
